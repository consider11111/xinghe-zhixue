spring.application.name=xinghe-zhixue
server.port=8090
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=${XINGHE_DB_URL:jdbc:h2:mem:xinghe_zhixue;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${XINGHE_DB_USERNAME:sa}
spring.datasource.password=${XINGHE_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:admin-schema.sql,classpath:training-schema.sql
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8
