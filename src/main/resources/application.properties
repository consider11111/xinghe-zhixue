spring.application.name=xinghe-zhixue
server.port=8090
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=${XINGHE_DB_URL:jdbc:mysql://localhost:3306/xinghe_zhixue?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${XINGHE_DB_USERNAME:root}
spring.datasource.password=${XINGHE_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:admin-schema.sql
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8
